name: NostrVpnIos
options:
  bundleIdPrefix: ${NVPN_IOS_BUNDLE_ID}
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  DeviceDebug: debug
  Release: release

settings:
  base:
    MARKETING_VERSION: ${NVPN_APP_VERSION_NAME}
    # Apple uses (CFBundleShortVersionString, CFBundleVersion) as the unique
    # build key on App Store Connect. Hardcoding CURRENT_PROJECT_VERSION = 1
    # makes every TestFlight upload at the same marketing version conflict
    # silently. NVPN_APP_VERSION_CODE comes from the tracked
    # ios/app-store-build-number (or an explicit NVPN_IOS_BUILD_NUMBER) so a
    # corrected upload can advance CFBundleVersion without changing the Cargo
    # or App Store marketing version.
    # All entry points (scripts/ios-build for release, tools/run-ios for
    # debug/sim) source release_common.sh + run resolve_ios_build_metadata
    # before xcodegen so both env vars resolve at project-generation time.
    # xcodegen only supports plain ${VAR} substitution — bash-style
    # ${VAR:-default} leaks through verbatim into pbxproj and breaks builds.
    CURRENT_PROJECT_VERSION: ${NVPN_APP_VERSION_CODE}
    VERSIONING_SYSTEM: apple-generic
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    ENABLE_DEBUG_DYLIB: NO
    NVPN_IOS_BUNDLE_ID: ${NVPN_IOS_BUNDLE_ID}
    NVPN_IOS_PACKET_TUNNEL_BUNDLE_ID: ${NVPN_IOS_PACKET_TUNNEL_BUNDLE_ID}
    NVPN_IOS_APP_GROUP_IDENTIFIER: ${NVPN_IOS_APP_GROUP_IDENTIFIER}

targets:
  NostrVpnIos:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Nostr VPN
        PRODUCT_MODULE_NAME: NostrVpnIos
        PRODUCT_BUNDLE_IDENTIFIER: ${NVPN_IOS_BUNDLE_ID}
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: NostrVpnIos.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Bindings
        SWIFT_OBJC_BRIDGING_HEADER: Bindings/NostrVpnAppCoreC.h
      configs:
        DeviceDebug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: $(NVPN_IOS_CODE_SIGN_IDENTITY)
          PROVISIONING_PROFILE: $(NVPN_IOS_PROVISIONING_PROFILE_UUID)
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: $(NVPN_IOS_CODE_SIGN_IDENTITY)
          PROVISIONING_PROFILE: $(NVPN_IOS_PROVISIONING_PROFILE_UUID)
    dependencies:
      - framework: Frameworks/NostrVpnAppCore.xcframework
        embed: false
      - target: PacketTunnel
        embed: true
        codeSign: true
        copy:
          destination: plugins
      - target: ShareFiles
        embed: true
        codeSign: true
        copy:
          destination: plugins
      - sdk: NetworkExtension.framework
      - sdk: AppIntents.framework
      - sdk: SystemConfiguration.framework

  ShareFiles:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareFiles
      - path: Shared
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: ShareFiles
        PRODUCT_MODULE_NAME: ShareFiles
        PRODUCT_BUNDLE_IDENTIFIER: ${NVPN_IOS_BUNDLE_ID}.ShareFiles
        INFOPLIST_FILE: ShareFiles/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareFiles/ShareFiles.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        DeviceDebug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: $(NVPN_IOS_CODE_SIGN_IDENTITY)
          PROVISIONING_PROFILE: $(NVPN_IOS_SHARE_FILES_PROVISIONING_PROFILE_UUID)
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: $(NVPN_IOS_CODE_SIGN_IDENTITY)
          PROVISIONING_PROFILE: $(NVPN_IOS_SHARE_FILES_PROVISIONING_PROFILE_UUID)

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared/FileTransferPresentation.swift
      - path: Shared/FileTransferObservation.swift
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Nostr VPN Tunnel
        PRODUCT_MODULE_NAME: PacketTunnel
        PRODUCT_BUNDLE_IDENTIFIER: ${NVPN_IOS_PACKET_TUNNEL_BUNDLE_ID}
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Bindings
        SWIFT_OBJC_BRIDGING_HEADER: Bindings/NostrVpnAppCoreC.h
      configs:
        DeviceDebug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: $(NVPN_IOS_CODE_SIGN_IDENTITY)
          PROVISIONING_PROFILE: $(NVPN_IOS_PACKET_TUNNEL_PROVISIONING_PROFILE_UUID)
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: $(NVPN_IOS_CODE_SIGN_IDENTITY)
          PROVISIONING_PROFILE: $(NVPN_IOS_PACKET_TUNNEL_PROVISIONING_PROFILE_UUID)
    dependencies:
      - framework: Frameworks/NostrVpnAppCore.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: SystemConfiguration.framework

  NostrVpnIosUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${NVPN_IOS_BUNDLE_ID}.UITests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nostr VPN Test Files
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        TEST_TARGET_NAME: NostrVpnIos
    dependencies:
      - target: NostrVpnIos

schemes:
  NostrVpnIos:
    build:
      targets:
        NostrVpnIos: all
        NostrVpnIosUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NostrVpnIosUITests
      environmentVariables:
        NVPN_XCUITEST_RUN_ID: "$(NVPN_XCUITEST_RUN_ID)"
        NVPN_XCUITEST_EXIT_DNS_SPEC_BASE64: "$(NVPN_XCUITEST_EXIT_DNS_SPEC_BASE64)"
        NVPN_XCUITEST_CONNECTED_DIRECT_GATE: "$(NVPN_XCUITEST_CONNECTED_DIRECT_GATE)"
        NVPN_XCUITEST_APP_LAUNCH_ARGS_BASE64: "$(NVPN_XCUITEST_APP_LAUNCH_ARGS_BASE64)"
        NVPN_XCUITEST_LIFECYCLE_GATE: "$(NVPN_XCUITEST_LIFECYCLE_GATE)"
        NVPN_XCUITEST_LIFECYCLE_RESULT_NAME: "$(NVPN_XCUITEST_LIFECYCLE_RESULT_NAME)"
        NVPN_XCUITEST_LIFECYCLE_CYCLES: "$(NVPN_XCUITEST_LIFECYCLE_CYCLES)"
        NVPN_XCUITEST_LIFECYCLE_BACKGROUND_DWELL_SECS: "$(NVPN_XCUITEST_LIFECYCLE_BACKGROUND_DWELL_SECS)"
        NVPN_XCUITEST_RELEASE_NETWORK_GATE: "$(NVPN_XCUITEST_RELEASE_NETWORK_GATE)"
        NVPN_XCUITEST_RELEASE_NETWORK_SPEC_BASE64: "$(NVPN_XCUITEST_RELEASE_NETWORK_SPEC_BASE64)"
        NVPN_RELEASE_JOIN_BLACKBOX: "$(NVPN_RELEASE_JOIN_BLACKBOX)"
        NVPN_RELEASE_JOIN_ADMIN_ID: "$(NVPN_RELEASE_JOIN_ADMIN_ID)"
        NVPN_RELEASE_JOIN_NETWORK_ID: "$(NVPN_RELEASE_JOIN_NETWORK_ID)"
        NVPN_RELEASE_JOIN_JOINER_ID: "$(NVPN_RELEASE_JOIN_JOINER_ID)"
        NVPN_RELEASE_JOIN_NETWORK_NAME: "$(NVPN_RELEASE_JOIN_NETWORK_NAME)"
        NVPN_RELEASE_JOIN_DELIVERY_WAIT_SECS: "$(NVPN_RELEASE_JOIN_DELIVERY_WAIT_SECS)"
        NVPN_RELEASE_JOIN_CAMERA_WAIT_SECS: "$(NVPN_RELEASE_JOIN_CAMERA_WAIT_SECS)"
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
