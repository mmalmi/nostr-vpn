name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release-tooling-contracts:
    name: Release tooling contracts
    # Several harnesses compile tiny ownership fixtures with xcrun. Linux import
    # contracts run independently on their native platform below.
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The package preflight regression exercises real multi-package Cargo.
      - name: Setup release Cargo
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install release tooling dependencies
        run: brew install ripgrep

      - name: Test release tooling contracts
        run: ./scripts/test-release-tooling-contracts.sh

  linux-tooling-contracts:
    name: Linux tooling (${{ matrix.contract }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contract:
          - host-linux-vm-import-only
          - linux-gui-e2e-lockfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Test Linux release tooling
        run: ./scripts/test-${{ matrix.contract }}-harness.sh

  dataplane-tooling-contracts:
    name: Dataplane tooling contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Test dataplane tooling
        run: ./scripts/test-dataplane-safety-fast.sh harnesses

  fleet-contracts:
    name: Fleet rollout contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Test post-release fleet rollout
        run: ./scripts/test-fleet-release-canary-harness.sh

  rust-tests:
    name: Rust lint + workspace tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Keep ordinary CI on the compiler verified by the release gate.
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-on-failure: true

      # One full workspace run includes every focused nvpn/app-core test.
      # Keep lint in this job so it shares the same resolved dependencies.
      - name: Check source formatting and lints
        run: |
          python3 scripts/test-native-lab.py
          node scripts/sync-versions.mjs --check
          cargo fmt --check -p nvpn -p nostr-vpn-app-core -p nostr-vpn-core -p nostr-vpn-sim -p nostr-vpn-web -p nostr-vpn-wintun -p nostr-vpn-uniffi-bindgen
          cargo clippy --locked --workspace --exclude nvpn-cashu-service --exclude nvpn-cdk-spilman --all-targets --no-deps -- -D warnings

      - name: Run workspace tests once
        run: cargo test --locked --workspace

      - name: Check cleanup journal ownership as root
        run: |
          set -o pipefail
          cargo test --locked --workspace --no-run --message-format=json > "$RUNNER_TEMP/nvpn-test-artifacts.jsonl"
          nvpn_test_binary="$(python3 -c '
          import json, sys
          records = [json.loads(line) for line in open(sys.argv[1])]
          paths = {r["executable"] for r in records
                   if r.get("reason") == "compiler-artifact"
                   and r.get("target", {}).get("name") == "nvpn"
                   and r.get("target", {}).get("kind") == ["bin"]
                   and r.get("profile", {}).get("test") is True
                   and r.get("executable")}
          if len(paths) != 1:
              raise SystemExit("expected exactly one current nvpn test executable")
          print(paths.pop())
          ' "$RUNNER_TEMP/nvpn-test-artifacts.jsonl")"
          git rev-parse HEAD 'HEAD^{tree}'
          sha256sum "$nvpn_test_binary"
          sudo -n "$nvpn_test_binary" --exact daemon_runtime::linux_cleanup_journal_files::root_cleanup_journal_rejects_unprivileged_ownership --ignored --nocapture | tee "$RUNNER_TEMP/nvpn-root-cleanup-test.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/nvpn-root-cleanup-test.log"

  web:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Check web sources
        run: npm ci && npm run check

  macos-sdk-compat:
    name: Xcode 15 macOS compatibility
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Type-check scanner with Xcode 15.4
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
        run: ./scripts/check-macos-swift-sdk-compat.sh
