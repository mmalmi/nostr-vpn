name: macOS PR 154 verification

on:
  workflow_dispatch:

jobs:
  service-gates:
    name: macOS service install gates commands
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-on-failure: true

      # Warm the registry so the fixture project can resolve --offline.
      - name: Fetch workspace dependencies
        run: cargo fetch --locked

      - name: Protected filesystem fixtures (root)
        run: ./scripts/test-macos-privileged-files.sh --root

      # The CLI symlink install tests are unix-gated and the service install
      # post-condition tests are macOS-gated; this is where they execute.
      - name: Rust install and service gates
        run: |
          cargo test --locked -p nvpn install_cli
          cargo test --locked -p nvpn app_bundle_detection
          cargo test --locked -p nostr-vpn-app-core --lib macos_service_install
