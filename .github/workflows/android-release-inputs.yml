name: Android Release inputs

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Qualify inputs, build the unsigned bundle, or check admission fixtures
        type: choice
        default: inventory
        options: [inventory, qualify-ndk, build, admission-check, collect-receipts]
      producer_run:
        description: Exact successful producer run for receipt collection
        type: string
        default: ''
      producer_commit:
        description: Full reviewed producer commit for receipt collection
        type: string
        default: ''
      authenticate_inputs:
        description: Also run the pinned release gate against the retained unsigned inputs
        type: boolean
        default: false
  push:
    branches: [codex/nvpn-hosted-apple-producer, codex/nvpn-hosted-android-producer]
    paths:
      - .github/workflows/android-release-inputs.yml
      - scripts/build-android-release-inputs.py
      - scripts/android-release-inputs.json
      - scripts/test-android-release-inputs.py

permissions:
  contents: read

concurrency:
  group: android-release-inputs-${{ github.ref }}${{ github.event_name == 'push' && '-checks' || inputs.operation == 'admission-check' && '-admission' || inputs.operation == 'collect-receipts' && '-receipts' || '' }}
  cancel-in-progress: false

jobs:
  producer-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/build-android-release-inputs.py
            scripts/android-release-inputs.json
            scripts/test-android-release-inputs.py
      - name: Verify producer boundaries without compiling products
        run: |
          python3 - <<'PY'
          import os, subprocess, tempfile
          subprocess.run(['df', '-PT', tempfile.gettempdir(), os.environ['RUNNER_TEMP']], check=True)
          PY
          python3 scripts/test-android-release-inputs.py
  inputs:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'inventory' || inputs.operation == 'qualify-ndk' || inputs.operation == 'build')
    needs: producer-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check capacity before source checkout
        run: |
          python3 - <<'PY'
          import shutil
          available = shutil.disk_usage('.').free
          print(f'Hosted free bytes before checkout: {available}')
          if available < 20 * 1024**3 + 256 * 1024**2:
              raise SystemExit('20 GiB reserve plus bounded checkout growth is unavailable')
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/build-android-release-inputs.py
            scripts/android-release-inputs.json
      - name: Check frozen application source
        if: inputs.operation == 'build'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 52a1f8eee3cf19c5bc467a3ccf39d3d6d74437f4
          path: app
          persist-credentials: false
      - name: Check frozen FIPS source
        if: inputs.operation == 'build'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: mmalmi/fips
          ref: d0b18f2d1b2e97d42fa8460a0c70a8dffeaa2552
          path: fips
          persist-credentials: false
      - name: Qualify inputs without compiling or signing
        if: inputs.operation != 'build'
        env:
          ANDROID_INPUT_OPERATION: ${{ inputs.operation }}
        run: python3 scripts/build-android-release-inputs.py "$ANDROID_INPUT_OPERATION" qualification
      - name: Produce the unsigned frozen Android bundle
        if: inputs.operation == 'build'
        run: python3 scripts/build-android-release-inputs.py build android-release-inputs --app app --fips fips
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: ${{ inputs.operation == 'build' && 'android-release-inputs-52a1f8ee' || 'android-release-input-inventory' }}
          path: ${{ inputs.operation == 'build' && 'android-release-inputs/' || 'qualification/' }}
          if-no-files-found: error
          retention-days: 14
  admission-checks:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'admission-check'
    needs: producer-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 3f6dbc53c40d319c01e25ed177769d398d81bd1f
          path: admission
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/android_hosted_content.py
            scripts/android_hosted_inputs.py
            scripts/android_hosted_admission.py
            scripts/test-android-hosted-content.py
            scripts/test-android-hosted-admission.py
            scripts/mobile_release_artifact_receipt.py
            scripts/lib-mobile-android-release-gate.sh
      - name: Check hosted admission fixtures without importing any product
        working-directory: admission
        run: |
          python3 -B scripts/test-android-hosted-content.py
          python3 -B scripts/test-android-hosted-admission.py
  artifact-receipts:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'collect-receipts'
    needs: producer-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/build-android-release-inputs.py
            scripts/android-release-inputs.json
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 20c122fb6a48de21fa1865605df5c95866d73013
          path: validator
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/android_hosted_content.py
            scripts/android_hosted_inputs.py
            scripts/android_hosted_admission.py
      - name: Authenticate the service ZIP and return only small receipts
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: validator/scripts
          PRODUCER_RUN: ${{ inputs.producer_run }}
          PRODUCER_COMMIT: ${{ inputs.producer_commit }}
          AUTHENTICATE_INPUTS: ${{ inputs.authenticate_inputs }}
        run: |
          arguments=()
          if [[ "$AUTHENTICATE_INPUTS" == true ]]; then arguments+=(--authenticate-inputs); fi
          python3 -B scripts/build-android-release-inputs.py collect-receipts receipts --run-id "$PRODUCER_RUN" --producer-commit "$PRODUCER_COMMIT" "${arguments[@]}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: android-release-receipts-${{ inputs.producer_run }}
          path: receipts/
          if-no-files-found: error
          retention-days: 14
