name: Linux desktop installer

on:
  workflow_dispatch:
  push:
    branches: [camera-selector]

permissions:
  contents: read

concurrency:
  group: linux-desktop-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debian13:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Install Debian 13 build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config clang libclang-dev \
            libgtk-4-dev libadwaita-1-dev libssl-dev libdbus-1-dev python3 file

      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: Check Linux source formatting
        run: cargo fmt --manifest-path linux/Cargo.toml -- --check

      - name: Build the daemon and desktop app
        run: |
          cargo build --release --locked --bin nvpn
          cargo build --release --locked --manifest-path linux/Cargo.toml

      - name: Test QR scanning and camera process cleanup
        run: cargo test --release --locked --manifest-path linux/Cargo.toml qr_scan::tests -- --nocapture

      - name: Install Debian packaging tool
        run: cargo install cargo-deb --locked --version 3.8.0

      - name: Package and verify the installer
        run: |
          mkdir -p linux/target/release dist
          cp target/release/nostr-vpn linux/target/release/nostr-vpn
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("linux/Cargo.toml", "rb"))["package"]["version"])')"
          unset CARGO_TARGET_DIR
          cargo deb --manifest-path linux/Cargo.toml --locked --no-build --no-strip \
            --deb-version "${version}-1+camera.${GITHUB_RUN_NUMBER}" \
            --output dist/nostr-vpn-debian13-amd64.deb
          test "$(dpkg-deb -f dist/nostr-vpn-debian13-amd64.deb Package)" = nostr-vpn
          test "$(dpkg-deb -f dist/nostr-vpn-debian13-amd64.deb Architecture)" = amd64
          dpkg-deb -x dist/nostr-vpn-debian13-amd64.deb "$RUNNER_TEMP/package-check"
          cmp target/release/nostr-vpn "$RUNNER_TEMP/package-check/usr/bin/nostr-vpn"
          cmp target/release/nvpn "$RUNNER_TEMP/package-check/usr/bin/nvpn"
          apt-get install -y ./dist/nostr-vpn-debian13-amd64.deb
          nvpn --version
          cd dist
          sha256sum nostr-vpn-debian13-amd64.deb > SHA256SUMS
          printf 'Repository: %s\nCommit: %s\nTarget: Debian 13 amd64\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" > BUILD-INFO.txt

      - uses: actions/upload-artifact@v6
        with:
          name: nostr-vpn-debian13-amd64-camera-selector
          path: dist/
          retention-days: 90
          if-no-files-found: error
