name: Apple Release inputs

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Unsigned products to prepare
        type: choice
        default: '["ios","macos"]'
        options:
          - '["ios","macos"]'
          - '["ios"]'
          - '["macos"]'
          - '["ios-join"]'
          - '["macos-support"]'
  push:
    branches: [codex/nvpn-hosted-apple-producer]
    paths:
      - .github/workflows/apple-release-inputs.yml
      - scripts/build-apple-release-inputs.py
      - scripts/apple-rust-distribution.json

permissions:
  contents: read

concurrency:
  group: apple-release-inputs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inputs:
    # Source pushes register the workflow; expensive builds are explicit.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms || '["ios","macos"]') }}
    env:
      APP_COMMIT: 52a1f8eee3cf19c5bc467a3ccf39d3d6d74437f4
      APP_TREE: 2f722bd2e0f34e7b71cae665cce74c3080c99661
      FIPS_COMMIT: d0b18f2d1b2e97d42fa8460a0c70a8dffeaa2552
      FIPS_TREE: 08ceced056b8592a2b2c840c4c276bf01cf28c85
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RUSTUP_TOOLCHAIN: nvpn-apple-1.95.0
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
    steps:
      - name: Record actual hosted capacity before installing tools
        run: |
          mkdir -p qualification
          python3 - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path
          value = {"freeBytes": shutil.disk_usage('.').free,
                   "totalBytes": shutil.disk_usage('.').total,
                   "memoryBytes": int(subprocess.check_output(['sysctl', '-n', 'hw.memsize'])),
                   "imageVersion": os.environ.get('ImageVersion'),
                   "imageOS": os.environ.get('ImageOS'),
                   "rustBuildAdmitted": False}
          Path('qualification/runner-capacity.json').write_text(json.dumps(value, indent=2)+'\n')
          print(json.dumps(value))
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: producer
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.APP_COMMIT }}
          path: app
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: mmalmi/fips
          ref: ${{ env.FIPS_COMMIT }}
          path: fips
          persist-credentials: false
      - name: Select and verify the qualified Apple SDK
        run: |
          test "$(uname -m)" = arm64
          test "$(xcodebuild -version)" = $'Xcode 26.6\nBuild version 17F113'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 26.5
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = 26.5
          test "$(xcrun --sdk macosx --show-sdk-version)" = 26.5
          sudo xcode-select --switch "$DEVELOPER_DIR"
      - name: Install Rust from the committed distribution payload checksums
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess, tempfile, urllib.request
          from pathlib import Path
          pins = json.loads(Path('producer/scripts/apple-rust-distribution.json').read_text())
          prefix = Path(os.environ['RUNNER_TEMP']) / 'nvpn-rust-1.95.0'
          assert not prefix.exists()
          for item in pins['components']:
              assert shutil.disk_usage(prefix.parent).free > 4 * 1024**3
              with tempfile.TemporaryDirectory(dir=prefix.parent, prefix='rust-component-') as tmp:
                  root = Path(tmp)
                  archive = root / 'component.tar.xz'
                  digest = hashlib.sha256()
                  with urllib.request.urlopen(item['url'], timeout=60) as source, archive.open('wb') as target:
                      while block := source.read(1024 * 1024):
                          digest.update(block)
                          target.write(block)
                  assert digest.hexdigest() == item['sha256'], 'Rust distribution checksum differs'
                  subprocess.run(['tar', '-xJf', str(archive), '-C', str(root)], check=True)
                  installers = list(root.glob('*/install.sh'))
                  assert len(installers) == 1
                  subprocess.run(['sh', str(installers[0]), '--prefix=' + str(prefix),
                                  '--disable-ldconfig'], check=True)
          subprocess.run(['rustup', 'toolchain', 'link', 'nvpn-apple-1.95.0', str(prefix)], check=True)
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write(str(prefix / 'bin') + '\n')
          Path('qualification/rust-distribution.json').write_text(json.dumps(pins, indent=2)+'\n')
          PY
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app -> target
          key: apple-release-${{ startsWith(matrix.platform, 'macos') && 'macos' || 'ios' }}-xcode17F113-rust1.95.0
          cache-bin: false
          cache-on-failure: true
      - name: Install the pinned project generator
        run: |
          curl --fail --location --retry 2 https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/pinned-xcodegen"
          echo "$RUNNER_TEMP/pinned-xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build the exact source's unsigned Release products
        run: python3 producer/scripts/build-apple-release-inputs.py "${{ matrix.platform }}" app fips output
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: apple-release-inputs-${{ matrix.platform }}-${{ env.APP_COMMIT }}
          path: |
            output/
            qualification/
          if-no-files-found: error
          retention-days: 14
