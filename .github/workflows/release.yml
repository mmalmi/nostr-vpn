name: Release

run-name: >-
  Release ${{ inputs.tag }} @ ${{ inputs.locally_attested_commit }} from ${{ inputs.locally_gated_release_cid }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v4.0.0)'
        required: true
      locally_attested_commit:
        description: 'Exact clean commit that passed the mandatory local physical/VM release gate'
        required: true
      locally_gated_release_cid:
        description: 'Immutable nhash CID of the locally gated htree draft'
        required: true

env:
  CARGO_TERM_COLOR: always
  # Match the compiler used by the exact local/native release gates.
  RELEASE_RUST_TOOLCHAIN: '1.95.0'

jobs:
  verify:
    name: Verify release inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.locally_attested_commit }}

      - name: Require the exact locally gated commit
        shell: bash
        env:
          LOCALLY_ATTESTED_COMMIT: ${{ github.event.inputs.locally_attested_commit }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "${LOCALLY_ATTESTED_COMMIT}" != "${actual}" ]]; then
            echo "::error::Local gate commit ${LOCALLY_ATTESTED_COMMIT} does not match tag commit ${actual}."
            exit 1
          fi

      - name: Reclaim runner disk for the release gate
        shell: bash
        run: |
          set -euo pipefail
          df -h /

          # The verify job needs Rust, Docker, and Linux native libraries. The
          # hosted image's Android, .NET, GHC, and CodeQL installations are not
          # used here and otherwise leave too little room for the full gate.
          unused_paths=(
            /usr/local/lib/android
            /usr/share/dotnet
            /opt/ghc
            /usr/local/.ghcup
            /opt/hostedtoolcache/CodeQL
          )
          for path in "${unused_paths[@]}"; do
            if [[ -e "${path}" ]]; then
              sudo rm -rf -- "${path}"
            fi
          done
          docker system prune --all --force

          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RELEASE_RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq libdbus-1-dev pkg-config ripgrep

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          cache-bin: false
          save-if: true

      - name: Use the contention-safe release scripts for v4.1.3 retries
        if: ${{ github.event.inputs.tag == 'v4.1.3' }}
        run: |
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          for script in \
            scripts/release-gate.sh \
            scripts/test-release-gate-parallel-harness.sh \
            scripts/e2e-fips-roaming-docker.sh
          do
            git show "${GITHUB_SHA}:${script}" > "${script}.next"
            chmod --reference="${script}" "${script}.next"
            mv "${script}.next" "${script}"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Prepare browser fixtures before concurrent Docker checks
        run: |
          pnpm --dir web/control-panel install --frozen-lockfile
          pnpm --dir web/control-panel exec playwright install --with-deps chromium

      - name: Load reviewed verifier policies for the frozen candidate
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          mkdir -p "${RUNNER_TEMP}/verifier/scripts"
          for script in scripts/release-gate.sh scripts/security-audit-rust.sh scripts/check-source-file-lines.sh; do
            git show "${GITHUB_SHA}:${script}" > "${RUNNER_TEMP}/verifier/${script}"
            chmod +x "${RUNNER_TEMP}/verifier/${script}"
          done

      - name: Run hosted release verification
        env:
          # Hardware and calibrated timing checks remain mandatory in the
          # artifact-bound local gate. This job checks portable source/Docker.
          NVPN_RELEASE_GATE_IDLE_CPU: '0'
          NVPN_E2E_ROAMING_LOADED_LATENCY: '0'
          NVPN_RELEASE_APP_REPO_PATH: ${{ github.workspace }}
        run: bash "${RUNNER_TEMP}/verifier/scripts/release-gate.sh" --hosted

      - name: Show checkout changes after failed verification
        if: failure()
        run: |
          git status --short
          git diff --stat

  # Native packages already passed the mandatory exact-artifact local gate.
  # Rebuilding different bytes here cannot strengthen those package receipts.
  # The older-SDK proof is reusable only for its byte-identical source inputs.
  # Run the remaining harnesses on a supported hosted image.
  macos-sdk-compat:
    name: macOS 14 SDK compatibility
    # The standard Intel pool avoids the current arm64 capacity failures.
    runs-on: macos-15-intel
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.locally_attested_commit }}

      - name: Load the pinned workflow verifier
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git show "${GITHUB_SHA}:scripts/verify-macos14-sdk-evidence.mjs" > "${RUNNER_TEMP}/verify-macos14-sdk-evidence.mjs"
          # Keep source-relative reads bound to the frozen product checkout.
          cp "${RUNNER_TEMP}/verify-macos14-sdk-evidence.mjs" scripts/verify-macos14-sdk-evidence.mjs

      - name: Verify unchanged macOS 14 SDK compatibility evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-macos14-sdk-evidence.mjs

      - name: Verify iOS release artifact orchestration without devices
        run: |
          ./scripts/test-mobile-release-join-gate-harness.sh
          ./scripts/test-mobile-ios-release-runner-harness.sh

  retained-assets:
    name: Verify retained exact 4.1.21 asset evidence
    if: ${{ inputs.tag == 'v4.1.21' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout pinned verifier
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Verify the successful immutable asset job
        env:
          GH_TOKEN: ${{ github.token }}
          NVPN_RELEASE_TAG: ${{ inputs.tag }}
          NVPN_RELEASE_COMMIT: ${{ inputs.locally_attested_commit }}
          NVPN_RELEASE_CID: ${{ inputs.locally_gated_release_cid }}
        run: node scripts/verify-retained-release-assets.mjs

  release:
    name: Verify exact locally gated assets (no publication)
    if: ${{ inputs.tag != 'v4.1.21' }}
    # Importing the immutable bundle is independent of the source checks.
    # Local publication still requires the entire workflow to succeed.
    runs-on: ubuntu-24.04
    env:
      RELEASE_HTREE_VERSION: '0.3.1'
      RELEASE_HTREE_SHA256: 'a909181cc50a0e24c1c512f6ed3ed437fe9bce3deb329257b8bf208abbd036cd'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.locally_attested_commit }}

      - name: Install pinned htree client
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/hashtree.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/mmalmi/hashtree/releases/download/v${RELEASE_HTREE_VERSION}/hashtree-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "${RELEASE_HTREE_SHA256}" "$archive" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/hashtree"
          tar -xzf "$archive" --strip-components=1 -C "${RUNNER_TEMP}/hashtree"
          echo "${RUNNER_TEMP}/hashtree" >> "$GITHUB_PATH"

      - name: Verify pinned htree client
        run: test "$(htree --version)" = "htree ${RELEASE_HTREE_VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pinned StartOS package inspector
        shell: bash
        env:
          STARTOS_CLI_VERSION: '1.1.0'
          STARTOS_CLI_SHA256: '70eff67b6e9a936acd8aaaf787b783819252ecedaa5c74d462e3b15ed4dd843a'
        run: |
          set -euo pipefail
          cli_path="${RUNNER_TEMP}/start-cli-${STARTOS_CLI_VERSION}-x86_64"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/Start9Labs/start-technologies/releases/download/start-cli/v${STARTOS_CLI_VERSION}/start-cli_x86_64-linux" \
            --output "${cli_path}"
          printf '%s  %s\n' "${STARTOS_CLI_SHA256}" "${cli_path}" \
            | sha256sum --check -
          sudo install -m 755 "${cli_path}" /usr/local/bin/start-cli
          test "$(start-cli --version)" = "start-cli ${STARTOS_CLI_VERSION}"

      - name: Import and verify the immutable locally gated release
        shell: bash
        env:
          LOCALLY_ATTESTED_COMMIT: ${{ github.event.inputs.locally_attested_commit }}
          LOCALLY_GATED_RELEASE_CID: ${{ github.event.inputs.locally_gated_release_cid }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${LOCALLY_GATED_RELEASE_CID}" =~ ^nhash1[023456789acdefghjklmnpqrstuvwxyz]+$ ]]; then
            echo "::error::locally_gated_release_cid must be an immutable root nhash CID."
            exit 1
          fi
          actual_commit="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          if [[ "${LOCALLY_ATTESTED_COMMIT}" != "${actual_commit}" ]]; then
            echo "::error::Locally gated commit does not match the checked-out release tag."
            exit 1
          fi
          # Keep fetched chunks on this runner for one incomplete-download retry.
          # Every successful import still passes the exact bundle verifier below.
          for download_attempt in 1 2; do
            download_log="${RUNNER_TEMP}/release-download-${download_attempt}.stderr"
            if htree get "${LOCALLY_GATED_RELEASE_CID}" \
              --output locally-gated-release 2>"${download_log}"; then
              cat "${download_log}" >&2
              break
            fi
            cat "${download_log}" >&2
            if [[ "${download_attempt}" == 2 ]] \
              || ! grep -Eq '^Error: Failed to stream file chunk: Missing chunk: [0-9a-f]{64}$' "${download_log}"; then
              exit 1
            fi
          done
          node scripts/verify-release-publication-bundle.mjs \
            --stage-dir locally-gated-release \
            --tag "${RELEASE_TAG}" \
            --commit "${actual_commit}" \
            --tree "${actual_tree}" \
            --require-draft

      - name: Prepare release notes
        shell: bash
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          node scripts/render-release-notes.mjs \
            --tag "${RELEASE_TAG}" \
            --asset-dir locally-gated-release/assets \
            --asset-base-url "https://github.com/${RELEASE_REPOSITORY}/releases/download/${RELEASE_TAG}" \
            --changelog CHANGELOG.md \
            --out release-notes.md

      - name: Confirm publication remains local and fleet-gated
        run: |
          echo "GitHub Actions verified the immutable staged assets."
          echo "Public GitHub release mutation is performed locally only after fleet validation."
