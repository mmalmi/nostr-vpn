[package]
name = "nostr-vpn-app-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Native app state and action contract for Nostr VPN"
repository.workspace = true
publish = false

[lib]
name = "nostr_vpn_app_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["paid-exit", "updater"]
paid-exit = [
  "nostr-vpn-core/paid-exit",
  "nostr-vpn-core/cashu-wallet",
  "dep:cashu-service",
  "dep:cashu",
  "dep:nostr-pubsub-fips",
  "dep:nostr-pubsub",
]
updater = ["nostr-vpn-core/updater"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
cashu = { workspace = true, optional = true }
cashu-service = { workspace = true, optional = true, features = [
  "wallet",
  "spilman-wallet-http",
] }
dirs.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
fips-core.workspace = true
fips-endpoint.workspace = true
netdev.workspace = true
nostr-sdk.workspace = true
nostr-pubsub = { workspace = true, optional = true }
nostr-pubsub-fips = { workspace = true, optional = true }
nostr-identity.workspace = true
nostr-vpn-core = { workspace = true, features = ["secure-dns"] }
qrcode = { version = "0.14", default-features = false }
reqwest.workspace = true
rqrr = "0.10"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
uniffi.workspace = true

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
async-trait.workspace = true
hickory-proto.workspace = true
tracing-subscriber.workspace = true

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[lints.rust]
unsafe_code = "allow"
